<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Decorative corner flower -->
  <g opacity="0.9">
    <!-- Main flower petals -->
    <ellipse cx="30" cy="30" rx="25" ry="12" fill="url(#goldGrad)" transform="rotate(-45 30 30)"/>
    <ellipse cx="30" cy="30" rx="25" ry="12" fill="url(#goldGrad)" transform="rotate(0 30 30)"/>
    <ellipse cx="30" cy="30" rx="25" ry="12" fill="url(#goldGrad)" transform="rotate(45 30 30)"/>
    <circle cx="30" cy="30" r="8" fill="#F4E4BC"/>
    
    <!-- Leaves/vines extending -->
    <path d="M50 50 Q80 60 100 100 Q90 80 70 70 Q60 60 50 50" fill="url(#goldGrad)" opacity="0.7"/>
    <path d="M50 50 Q60 80 100 100 Q80 90 70 70 Q60 60 50 50" fill="url(#goldGrad)" opacity="0.5"/>
    
    <!-- Small decorative dots -->
    <circle cx="70" cy="85" r="3" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="85" cy="70" r="2" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="55" cy="65" r="2" fill="url(#goldGrad)" opacity="0.6"/>
    
    <!-- Additional small flowers -->
    <g transform="translate(60, 40) scale(0.4)">
      <ellipse cx="30" cy="30" rx="20" ry="8" fill="url(#goldGrad)" transform="rotate(-45 30 30)"/>
      <ellipse cx="30" cy="30" rx="20" ry="8" fill="url(#goldGrad)" transform="rotate(45 30 30)"/>
      <circle cx="30" cy="30" r="5" fill="#F4E4BC"/>
    </g>
    
    <g transform="translate(40, 60) scale(0.3)">
      <ellipse cx="30" cy="30" rx="20" ry="8" fill="url(#goldGrad)" transform="rotate(-30 30 30)"/>
      <ellipse cx="30" cy="30" rx="20" ry="8" fill="url(#goldGrad)" transform="rotate(30 30 30)"/>
      <circle cx="30" cy="30" r="5" fill="#F4E4BC"/>
    </g>
  </g>
</svg>
