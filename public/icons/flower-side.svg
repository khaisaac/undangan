<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 300" fill="none">
  <defs>
    <linearGradient id="goldGradSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vertical vine -->
  <path d="M20 0 Q30 50 25 100 Q20 150 25 200 Q30 250 20 300" 
        stroke="url(#goldGradSide)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Flowers along the vine -->
  <g transform="translate(15, 30) scale(0.5)">
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(-45 20 20)"/>
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(0 20 20)"/>
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(45 20 20)"/>
    <circle cx="20" cy="20" r="5" fill="#F4E4BC"/>
  </g>
  
  <g transform="translate(25, 80) scale(0.4)">
    <ellipse cx="20" cy="20" rx="15" ry="6" fill="url(#goldGradSide)" transform="rotate(-30 20 20)"/>
    <ellipse cx="20" cy="20" rx="15" ry="6" fill="url(#goldGradSide)" transform="rotate(30 20 20)"/>
    <circle cx="20" cy="20" r="4" fill="#F4E4BC"/>
  </g>
  
  <g transform="translate(10, 130) scale(0.5)">
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(-45 20 20)"/>
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(0 20 20)"/>
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(45 20 20)"/>
    <circle cx="20" cy="20" r="5" fill="#F4E4BC"/>
  </g>
  
  <g transform="translate(20, 180) scale(0.35)">
    <ellipse cx="20" cy="20" rx="15" ry="6" fill="url(#goldGradSide)" transform="rotate(-30 20 20)"/>
    <ellipse cx="20" cy="20" rx="15" ry="6" fill="url(#goldGradSide)" transform="rotate(30 20 20)"/>
    <circle cx="20" cy="20" r="4" fill="#F4E4BC"/>
  </g>
  
  <g transform="translate(15, 230) scale(0.45)">
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(-45 20 20)"/>
    <ellipse cx="20" cy="20" rx="18" ry="8" fill="url(#goldGradSide)" transform="rotate(45 20 20)"/>
    <circle cx="20" cy="20" r="5" fill="#F4E4BC"/>
  </g>
  
  <!-- Small leaves -->
  <ellipse cx="35" cy="50" rx="12" ry="5" fill="url(#goldGradSide)" opacity="0.5" transform="rotate(30 35 50)"/>
  <ellipse cx="10" cy="110" rx="10" ry="4" fill="url(#goldGradSide)" opacity="0.5" transform="rotate(-20 10 110)"/>
  <ellipse cx="40" cy="160" rx="12" ry="5" fill="url(#goldGradSide)" opacity="0.5" transform="rotate(25 40 160)"/>
  <ellipse cx="8" cy="210" rx="10" ry="4" fill="url(#goldGradSide)" opacity="0.5" transform="rotate(-30 8 210)"/>
  <ellipse cx="35" cy="260" rx="11" ry="4" fill="url(#goldGradSide)" opacity="0.5" transform="rotate(20 35 260)"/>
</svg>
